name: Homebrew audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Register checkout as a trusted tap
        run: |
          brew tap jmbenedetto/taps "$GITHUB_WORKSPACE"
          brew trust jmbenedetto/taps
      - name: Style
        run: brew style jmbenedetto/taps
      - name: Audit casks
        run: |
          for cask in blip-ai cua-driver dart happier koofr silverbullet vial zerowork; do
            brew audit --cask "jmbenedetto/taps/$cask"
          done
